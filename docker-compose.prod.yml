# Pinned explicitly: Compose otherwise names the project after the directory,
# and `--remove-orphans` would then treat containers of a neighbouring stack
# as orphans of this one.
name: sttm-frontend

services:
  frontend:
    container_name: sttm_frontend_prod
    # GITHUB_REPOSITORY=owner/repo, e.g. antongenso/step-to-the-moon. Set it in
    # the .env next to this file on the server.
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    restart: unless-stopped
    environment:
      # Server-side only (Next route handlers in app/api/**), never inlined into
      # the browser bundle. The backend publishes 5000 on the *host's* loopback,
      # which is unreachable from inside this container — so the call goes to the
      # backend container by name over the shared `prod` network below.
      STTM_API_URL: ${STTM_API_URL:-http://sttm_backend_prod:5000}
    # Published on loopback: nginx on the host terminates TLS and proxies here.
    ports:
      - "127.0.0.1:3000:3000"
    # `/` redirects to /intro or /uz, so a plain wget would report failure on a
    # perfectly healthy server. fetch follows the redirect; anything below 500
    # counts as alive.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - prod

networks:
  # Shared with the sttm-server stack. It has to be `external`, because a
  # network declared by a compose project is prefixed with that project's name
  # and belongs to it — the two stacks would each get their own isolated bridge
  # and could not resolve one another. Created by the deploy workflow with
  # `docker network create sttm_prod` if it does not exist yet.
  prod:
    external: true
    name: sttm_prod
