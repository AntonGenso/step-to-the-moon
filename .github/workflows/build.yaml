name: Package build

on:
  push:
    branches: ['main']
  workflow_dispatch:

jobs:
  deploy:
    name: Build and push Docker image to ghcr.io
    permissions:
      contents: read
      packages: write
    environment:
      name: production
      url: https://steptothemoon.uz/
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Fails in seconds instead of after the image build, and names the secret
      # that is missing — the ssh action itself only reports "can't connect".
      - name: Check deployment secrets
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          missing=""
          for name in SSH_HOST SSH_USER SSH_PORT SSH_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing or empty secrets:$missing — add them under Settings → Secrets and variables → Actions. SSH_PORT is the port the server is reachable on from outside, which is not the port sshd binds to locally."
            exit 1
          fi
          case "$SSH_PRIVATE_KEY" in
            *"PRIVATE KEY"*) ;;
            *) echo "::error::SSH_PRIVATE_KEY does not look like a private key: it must include the -----BEGIN ... PRIVATE KEY----- and -----END ...----- lines."; exit 1 ;;
          esac
          echo "Deployment secrets are present."

      # The default buildx driver ("docker") cannot export a cache; this swaps
      # in the docker-container driver, which is what `type=gha` needs. Next
      # builds are slow, so the cache is worth real minutes here.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ github.ref_name }}

      # NEXT_PUBLIC_* are build-time by design: Next inlines them into the
      # client bundle, so they are public either way.
      - name: Build and push Docker image to ghcr.io
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.NEXT_PUBLIC_FIREBASE_API_KEY }}
            NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ secrets.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN }}
            NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_PROJECT_ID }}
            NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET=${{ secrets.NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET }}
            NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
            NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.NEXT_PUBLIC_FIREBASE_APP_ID }}

      # Without this the server keeps whatever compose file it was set up with,
      # and changes to it never reach production.
      - name: Copy compose file to production server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: docker-compose.prod.yml
          target: ~/sttm

      - name: Deploy to production server
        uses: appleboy/ssh-action@v1.0.0
        env:
          GHCR_TOKEN: ${{ github.token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: GHCR_TOKEN,GITHUB_ACTOR,GITHUB_REPOSITORY
          script: |
            set -e
            echo $GHCR_TOKEN | docker login ghcr.io -u $GITHUB_ACTOR --password-stdin
            cd ~/sttm
            # ghcr.io rejects uppercase in image names.
            export GITHUB_REPOSITORY=$(echo $GITHUB_REPOSITORY | tr '[:upper:]' '[:lower:]')
            docker compose -f docker-compose.prod.yml pull
            # No --force-recreate: compose recreates only when the digest changed.
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
            docker image prune -f
